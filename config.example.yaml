name: Server
server:
  port: 9527
  # data_dir: 数据目录。留空时按以下顺序回退：
  #   1) --config 是绝对路径 → 与 config 文件同级的 data/（兼容 Debian 包：/etc/go-monitor/data）
  #   2) 否则 → 可执行文件同级的 data/
  # 也可显式写绝对路径，例如 /var/lib/go-monitor。
  data_dir: ""
  # trust_proxy: 是否信任 X-Forwarded-For / X-Real-IP 头。
  # 仅当本服务部署在可信反向代理之后再开启，否则会被伪造头绕过登录限速。
  trust_proxy: false
  # timezone: 用于聚合 daily/monthly 网络数据的时区，默认 UTC。
  # 例如 "Asia/Shanghai"。
  timezone: ""
auth:
  username: admin
  password: your_password_here
monitor:
  interval: 3
  memory: true
  cpu: true
  network_up: true
  network_down: true
  # lan_wan_split: 将网络流量按局域网/公网分别统计。
  # 自动使用 nftables（优先）或 iptables+ip6tables 作为后端。
  # 需要 root/CAP_NET_ADMIN 权限。
  # lan_wan_split: false
  disk_root: true
  disk_io: true
smtp:
  host: smtp.qq.com
  port: 587
  user: your_email@qq.com
  pass: your_password_here
  to:
    - your_email@example.com
alert:
  enabled: true
  duration: 30
  memory: true
  memory_threshold: 90
  cpu: true
  cpu_threshold: 90
  disk: true
  disk_threshold: 90
  # 注意: network_*_threshold / disk_*_threshold 的单位为 bytes/sec。
  network_up: false
  network_up_threshold: 104857600
  network_down: false
  network_down_threshold: 104857600
  disk_read: false
  disk_read_threshold: 104857600
  disk_write: false
  disk_write_threshold: 104857600
  # 磁盘 IOPS 告警: 读+写总每秒操作次数超过阈值时触发，单位 次/秒。
  disk_iops: false
  disk_iops_threshold: 1000
  interval: 600
  retention_days: 30
  monthly_retention_months: 12

